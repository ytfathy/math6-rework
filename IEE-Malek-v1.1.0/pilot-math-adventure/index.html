<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Adventure · Fractions | International Education Egypt</title>
<link rel="icon" href="iee-malek/assets/iee-logo-official.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Readex+Pro:wght@400;500;600&display=swap">

</head>
<body>

      <div class="brand-text">
        <strong data-t="app"></strong>
        <span data-t="subjectLabel"></span>

        <button type="button" data-lang="de">DE</button>
      </div>
    </div>
  </header>
  <main id="screen" class="screen" tabindex="-1"></main>

<script src="iee-malek/iee-malek.js"></script>
